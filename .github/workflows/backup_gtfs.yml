name: Daily GTFS Static Check

# Checks the 3 core GTFS Static feeds once a day and stores changed files only
# (per-file, content-addressed deduplication; see scripts/download_gtfs_static.py).
# 04:17 MYT = 20:17 UTC. The official recommendation is a daily refresh at 04:00;
# an off-the-hour minute is used because GitHub delays scheduled runs at :00.
# Once the cloud collector takes over the daily check, keep this workflow as an
# off-site backup or reduce it to weekly.
on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Check GTFS Static (store changed files only)
        run: python scripts/download_gtfs_static.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/gtfs_static
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(gtfs): static check $(TZ=Asia/Kuala_Lumpur date +'%Y-%m-%d %H:%M') MYT"
            git pull --rebase
            git push
          fi
