name: Weather Archive (temporary, until P0 collector is live)

# Temporary: archived weather forecast and warnings every 3 hours before the collector VM
# took over (design doc v0.4 §12.3). Forecasts are revised within the day (summary §6.1.3).
# 00:00, 03:00 ... 21:00 MYT = 16, 19, 22, 01, 04, 07, 10, 13 UTC.
# Since 2026-10-23 the collector VM archives weather (fyp-weather-*.timer). This workflow runs
# in parallel for a few days as a cross-check and is then deleted.
on:
  schedule:
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Download weather (only if content changed)
        run: python ingestion/download_weather.py

      - name: Commit and push archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/weather_forecast data/raw/weather_warning
          if git diff --staged --quiet; then
            echo "No new weather content."
          else
            git commit -m "chore(weather): archive $(TZ=Asia/Kuala_Lumpur date +'%Y-%m-%d %H:%M') MYT"
            git pull --rebase
            git push
          fi
