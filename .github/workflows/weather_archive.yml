name: Weather Archive (temporary, until P0 collector is live)

# 临时方案：云端采集服务上线前，每天两次归档天气预报与天气警告（设计书 v0.4 §12.3）
# 时间：马来西亚时间 07:00、19:00 = UTC 23:00、11:00
# 采集服务上线并接管天气采集后，删除本文件
on:
  schedule:
    - cron: '0 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Download weather (only if content changed)
        run: python scripts/download_weather.py

      - name: Commit and push archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/weather_forecast data/raw/weather_warning
          if git diff --staged --quiet; then
            echo "No new weather content."
          else
            git commit -m "chore(weather): archive $(TZ=Asia/Kuala_Lumpur date +'%Y-%m-%d %H:%M') MYT"
            git pull --rebase
            git push
          fi
