name: GTFS Realtime Probe (V06/V07, one-off)

# 一次性实测：2026-10-21（星期三）马来西亚时间 08:00、13:00、18:00、23:00 各运行一次
# 对应 UTC：00:00、05:00、10:00、15:00（同为 10 月 21 日）
# 注意：cron 每年同一天都会触发，实测完成后请删除本文件。
# GitHub 的定时任务可能延迟几分钟到半小时，对本实测影响不大。
on:
  schedule:
    - cron: '0 0,5,10,15 21 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # V06 要求同一天下载 Static 后再比对；内容有变化才会保存新版本
      - name: Refresh GTFS Static (only if content changed)
        run: python scripts/download_gtfs_static.py

      - name: Run realtime probe
        run: python scripts/check_realtime.py | tee probe_output.txt

      - name: Save output and commit
        run: |
          STAMP=$(TZ=Asia/Kuala_Lumpur date +'%Y%m%d_%H%M')
          mv probe_output.txt docs/evidence/realtime_probe/console_${STAMP}_MYT.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/evidence data/raw/gtfs_static/*.zip data/raw/gtfs_static/manifest.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(evidence): realtime probe ${STAMP} MYT"
            git pull --rebase
            git push
          fi
